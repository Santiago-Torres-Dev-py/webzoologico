<div class="container mt-4">
    <!-- TÍTULO Y SUBTÍTULO -->
    <div class="mb-4">
        <h2 class="fw-bold">🐾 WEB ZOOLÓGICO</h2>
        <p class="text-muted">Administración moderna de animales</p>
    </div>

    <!-- BOTÓN REGISTRAR (Azul como en la imagen) -->
    <button 
        class="btn btn-primary mb-3" 
        (click)="editableAnimal = false; animalForm.reset()"
        data-bs-toggle="modal" 
        data-bs-target="#animalModal">
        Registrar animal
    </button>

    <!-- TABLA (Estilo simple de la imagen) -->
    <div class="table-responsive">
        <table class="table table-striped table-hover border">
            <thead>
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Edad</th>
                    <th scope="col">Tipo</th>
                    <th scope="col">Editar</th>
                    <th scope="col">Eliminar</th>
                </tr>
            </thead>
            <tbody>
                <!-- Si la lista está vacía, esto no se mostrará -->
                <tr *ngFor="let item of animalList">
                    <td>{{ item.nombre }}</td>
                    <td>{{ item.edad }}</td>
                    <td>{{ item.tipo }}</td>
                    <td>
                        <button class="btn btn-primary btn-sm action-btn" (click)="toggleEditAnimal(item._id)" aria-label="Editar">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                    </td>
                    <td>
                        <button class="btn btn-primary btn-sm action-btn" (click)="deleteAnimalEntry(item._id)" aria-label="Eliminar">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
                <!-- Fila de aviso si no hay datos -->
                <tr *ngIf="animalList.length === 0">
                    <td colspan="5" class="text-center py-4 text-muted">
                        No hay animales registrados. Conecta tu API para ver los datos.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- FORMULARIO DE EDICIÓN (Aparece debajo si seleccionas editar) -->
<div *ngIf="editableAnimal" class="container mt-4">
    <div class="card p-4 shadow-sm border-primary">
        <h5 class="text-primary mb-3">Modificando animal...</h5>
        <form [formGroup]="animalForm" (ngSubmit)="updateAnimalEntry()">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="editNombre" class="form-label">Nombre</label>
                    <input id="editNombre" type="text" class="form-control" formControlName="nombre">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="editEdad" class="form-label">Edad</label>
                    <input id="editEdad" type="number" class="form-control" formControlName="edad">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="editTipo" class="form-label">Tipo</label>
                    <input id="editTipo" type="text" class="form-control" formControlName="tipo">
                </div>
            </div>
            <button type="submit" class="btn btn-success">Actualizar</button>
            <button type="button" class="btn btn-secondary ms-2" (click)="editableAnimal = false">Cancelar</button>
        </form>
    </div>
</div>

<!-- EL MODAL SE MANTIENE IGUAL PARA REGISTROS NUEVOS -->
